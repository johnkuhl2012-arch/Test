<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Untitled</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <div class="chat-container">
    <div class="chat-header">
        <h3>Voice Messenger</h3>
        <div id="status">Bereit (Max. 14s)</div>
    </div>
    <div id="messageList" class="chat-window"></div>
    <div class="input-area">
        <div id="timer">00:00</div>
        <button id="recordBtn" class="btn-round">🎤</button>
        <button id="stopBtn" class="btn-round" disabled>⏹</button>
        <button id="sendBtn" class="btn-send" disabled>Senden</button>
    </div>
</div>
    <script  src="./script.js"></script>

  </body>
  
</html>
